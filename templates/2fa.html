
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verificação 2FA</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #050505;
            color: #fff;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {
            width: 380px;
            max-width: 90%;
            padding: 40px 35px;

            background: #080808;
            border: 1px solid #222;
            border-radius: 14px;

            box-shadow: 0 20px 70px rgba(0, 0, 0, 0.9);
        }

        h1 {
            text-align: center;
            font-size: 26px;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .erro {
            color: #d00000;
            text-align: center;
            margin-bottom: 15px;
            font-size: 13px;
        }

        form {
            width: 100%;
        }

        input {
            width: 100%;
            padding: 15px;

            background: #0d0d0d;
            color: #fff;

            border: 1px solid #292929;
            border-radius: 8px;

            outline: none;

            text-align: center;
            font-size: 22px;
            letter-spacing: 6px;
        }

        input:focus {
            border-color: #800000;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 18px;

            background: #800000;
            color: #fff;

            border: none;
            border-radius: 8px;

            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #a00000;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>VERIFICAÇÃO</h1>

        <p>
            Digite o código de 6 dígitos do seu autenticador
        </p>

        {% if erro %}
            <div class="erro">
                {{ erro }}
            </div>
        {% endif %}

        <form method="POST" action="/2fa">

            <input
                type="text"
                name="codigo"
                placeholder="000000"
                maxlength="6"
                minlength="6"
                inputmode="numeric"
                autocomplete="one-time-code"
                pattern="[0-9]{6}"
                required
                autofocus
            >

            <button type="submit">
                VERIFICAR
            </button>

        </form>

    </div>

</body>
</html>
