<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {{ usuario.username }} | {{ config.site_name }}
    </title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(100, 0, 0, .16),
                    transparent 45%
                ),
                #030303;

            color: white;

            font-family: Arial, sans-serif;
        }

        header {
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            border-bottom: 1px solid #171717;

            background: rgba(5, 5, 5, .9);
        }

        .logo {
            font-size: 18px;

            font-weight: bold;

            letter-spacing: 3px;
        }

        .logo span {
            color: #8b0000;
        }

        header a {
            color: #777;

            text-decoration: none;

            font-size: 12px;
        }

        header a:hover {
            color: #b00000;
        }

        .container {
            max-width: 850px;

            margin: 70px auto;

            padding: 0 25px;
        }

        .profile {
            padding: 40px;

            background: rgba(10, 10, 10, .9);

            border: 1px solid #211010;

            border-radius: 16px;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, .5);
        }

        .avatar {
            width: 90px;
            height: 90px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            margin-bottom: 25px;

            background:
                linear-gradient(
                    135deg,
                    #300000,
                    #080808
                );

            border: 1px solid #650000;

            font-size: 30px;
        }

        h1 {
            font-size: 30px;
        }

        .level {
            display: inline-block;

            margin-top: 10px;

            padding: 6px 12px;

            color: #d28b8b;

            background: rgba(100, 0, 0, .15);

            border: 1px solid #390000;

            border-radius: 20px;

            font-size: 11px;
        }

        .grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;

            margin-top: 35px;
        }

        .item {
            padding: 20px;

            background: #070707;

            border: 1px solid #191919;

            border-radius: 10px;
        }

        .item small {
            display: block;

            color: #555;

            margin-bottom: 8px;

            font-size: 10px;

            text-transform: uppercase;
        }

        .item strong {
            font-size: 14px;
        }

        .made {
            margin-top: 40px;

            text-align: center;

            color: #444;

            font-size: 11px;
        }

        .made strong {
            color: #720000;
        }

        @media(max-width: 600px) {

            .profile {
                padding: 25px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <header>

        <div class="logo">
            <span>🩸</span> DEMON
        </div>

        <a href="/logout">
            SAIR
        </a>

    </header>

    <main class="container">

        <section class="profile">

            <div class="avatar">
                🩸
            </div>

            <h1>
                {{ usuario.username }}
            </h1>

            <div class="level">
                NÍVEL {{ usuario.level }}
            </div>

            <div class="grid">

                <div class="item">

                    <small>
                        Gmail
                    </small>

                    <strong>
                        {{ usuario.email }}
                    </strong>

                </div>

                <div class="item">

                    <small>
                        XP
                    </small>

                    <strong>
                        {{ usuario.xp }}
                    </strong>

                </div>

                <div class="item">

                    <small>
                        Status
                    </small>

                    <strong>
                        {{ usuario.status }}
                    </strong>

                </div>

                <div class="item">

                    <small>
                        Membro desde
                    </small>

                    <strong>
                        {{ usuario.created_at }}
                    </strong>

                </div>

            </div>

            <div class="made">
                made by <strong>demon</strong>
            </div>

        </section>

    </main>

</body>

</html>
