<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin | {{ config.site_name }}</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #020202;

            color: white;

            font-family: Arial, sans-serif;
        }

        .box {
            width: 390px;
            max-width: calc(100% - 30px);

            padding: 40px;

            background: #090909;

            border: 1px solid #320000;

            border-radius: 14px;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, .8);
        }

        .icon {
            text-align: center;

            font-size: 34px;

            margin-bottom: 10px;
        }

        h1 {
            text-align: center;

            font-size: 23px;

            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;

            color: #555;

            font-size: 12px;

            margin-top: 8px;

            margin-bottom: 30px;
        }

        label {
            display: block;

            color: #888;

            font-size: 11px;

            font-weight: bold;

            text-transform: uppercase;

            letter-spacing: 1px;

            margin-bottom: 8px;
        }

        .field {
            margin-bottom: 18px;
        }

        input {
            width: 100%;

            height: 47px;

            padding: 0 14px;

            background: #030303;

            color: white;

            border: 1px solid #242424;

            border-radius: 7px;

            outline: none;
        }

        input:focus {
            border-color: #700000;
        }

        button {
            width: 100%;

            height: 48px;

            background: #520000;

            color: white;

            border: 1px solid #800000;

            border-radius: 7px;

            font-weight: bold;

            cursor: pointer;

            transition: .25s;
        }

        button:hover {
            background: #750000;

            box-shadow:
                0 0 25px rgba(100, 0, 0, .25);
        }

        .error {
            margin-bottom: 18px;

            padding: 10px;

            color: #ffaaaa;

            background: rgba(100, 0, 0, .12);

            border: 1px solid #3a0000;

            border-radius: 7px;

            font-size: 12px;

            text-align: center;
        }

        .footer {
            text-align: center;

            color: #444;

            font-size: 10px;

            margin-top: 25px;
        }

    </style>

</head>

<body>

    <main class="box">

        <div class="icon">
            🩸
        </div>

        <h1>
            ÁREA ADMINISTRATIVA
        </h1>

        <p class="subtitle">
            acesso restrito ao proprietário
        </p>

        {% if erro %}

            <div class="error">
                {{ erro }}
            </div>

        {% endif %}

        <form
            action="/admin/login"
            method="POST"
        >

            <div class="field">

                <label>
                    Usuário
                </label>

                <input
                    type="text"
                    name="username"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="field">

                <label>
                    Senha
                </label>

                <input
                    type="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button type="submit">
                ENTRAR NO PAINEL
            </button>

        </form>

        <div class="footer">
            DEMON SYSTEM • OWNER ACCESS
        </div>

    </main>

</body>

</html>
